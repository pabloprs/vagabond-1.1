 else if(a=='r')r=[.8,18,22,.25,16,0,-14,0,0];
 if((a=='i'||a=='r')&&o.mv&&!air){r[4]=sin(ph)*18+8;r[5]=-max(0,cos(ph))*12;r[6]=-sin(ph)*18-8;r[7]=-max(0,-cos(ph))*12;r[3]+=.12}

 return r}
